        .beach__sand {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100vh;
        }
        .beach__sand--background {
            background-color: #F3F2F1;
            clip-path: path('M 0 300 L 0 60 C 450 120 500 30 650 130 C 750 230 850 130 1200 330');
            animation: seafoam1 10s infinite ease-in-out;
        }
        .beach__sand--foreground {
            z-index: 1;
            background: linear-gradient(200deg, #F5FCCD 0%, #ff7d66 300%);
            clip-path: path('M 0 300 L 0 100 C 450 125 500 50 650 150 C 750 250 850 150 1200 350');
            animation: seafoam2 10s infinite ease-in-out;
        }
        @keyframes water-moving {
            0%, 100% { transform: translate(0, -4%); }
            50% { transform: scale(1, 0.9) translate(0, 0); }
        }
        @keyframes seafoam1 {
            0%, 100% { clip-path: path('M 0 300 L 0 60 C 450 120 500 30 650 130 C 750 230 850 130 1200 330'); }
            50% { clip-path: path('M 0 300 L 0 120 C 450 200 500 60 650 160 C 750 240 850 120 1300 340'); }
        }
        @keyframes seafoam2 {
            0%, 100% { clip-path: path('M 0 300 L 0 100 C 450 125 500 50 650 150 C 750 250 850 150 1200 350'); }
            50% { clip-path: path('M 0 300 L 0 160 C 450 220 500 140 650 220 C 750 260 850 110 1200 350'); }
        }

        .progress-container {
            position: relative;
            width: 100%;
            height: 60px;
            margin: 20px 0 30px;
            background: var(--progress-bg);
            border-radius: 40px;
            overflow: hidden;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.1);
        }
       /* .progress-container .wave-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--solar), var(--success));
            transition: width 0.8s ease;
            border-radius: 40px;
        }*/
        .progress-container .wave-fill {
            height: 100%;
            width: 0%;
            /* background: url(https://png.pngtree.com/png-clipart/20230211/original/pngtree-ocean-waves-ocean-waves-png-image_8952553.png) repeat-x center / auto 100%;*/
            background: url(https://userscontent2.emaze.com/images/fabbff54-b2bb-48b9-949d-d26af8aec606/692ae5c2744f18a9e43829d67330d346.png) repeat-x center / auto 100%;
            transition: width 0.8s ease;
            border-radius: 40px;
            /* Чтобы волна двигалась при заполнении, можно добавить анимацию */
        }
        .progress-container .ship {
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem;
            transition: left 0.8s ease;
            left: 0%;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }
        .ship {
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 150px;  
            height: 150px;
            background: url('https://png.pngtree.com/png-clipart/20230810/original/pngtree-illustrative-vector-of-a-large-argo-boat-on-a-white-background-vector-picture-image_10275593.png') no-repeat center / contain;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
            transition: left 0.8s ease;
            left: 0%;
            z-index: 2;
            pointer-events: none;
            /* font-size убираем, т.к. теперь это фон */
        }

        .db-info {
            background: var(--day-bg);
            border: 2px solid var(--border);
            border-radius: 16px;
            padding: 16px 20px;
            margin-bottom: 24px;
            box-shadow: var(--shadow);
            transition: background 0.3s, border-color 0.3s;
        }
        .db-info h3 {
            margin-bottom: 8px;
            font-size: 1.1rem;
            color: var(--solar);
        }
        .db-info table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        .db-info th, .db-info td {
            padding: 4px 8px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        .db-info th {
            font-weight: 600;
        }
        .db-info .empty {
            opacity: 0.6;
            font-style: italic;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: var(--card);
            border-radius: 32px;
            box-shadow: var(--shadow);
            padding: 30px 40px;
            transition: background 0.3s;
            position: relative;
            z-index: 2;
            backdrop-filter: blur(2px);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 1.2em;
        }
        .header h1 {
            font-size: 2.8rem;
            background: linear-gradient(135deg, #facc15, #f97316);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }
        .theme-toggle {
            background: var(--toggle-bg);
            border: none;
            padding: 10px 18px;
            border-radius: 40px;
            font-size: 1.3rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text);
            transition: 0.2s;
        }
        .theme-toggle:hover { background: var(--toggle-hover); }
        .theme-toggle span { font-size: 0.9rem; font-weight: 500; }

        .subtitle {
            font-size: 1.2rem;
            opacity: 0.8;
            margin-bottom: 2em;
            text-align: center;
        }
        .subtitle small {
            display: block;
            font-size: 0.95rem;
            opacity: 0.7;
            margin-top: 6px;
        }

        .challenge {
            background: var(--day-bg);
            border: 2px solid var(--border);
            border-radius: 24px;
            padding: 24px 28px;
            margin-bottom: 24px;
            box-shadow: var(--shadow);
            transition: border-color 0.3s, background 0.3s;
        }
        .challenge .title {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--solar);
        }
        .challenge .story {
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 12px;
            opacity: 0.9;
        }
        .challenge .task {
            font-weight: 600;
            margin: 12px 0 8px;
            font-size: 1.1rem;
        }
        .challenge .task code {
            background: var(--toggle-bg);
            padding: 2px 8px;
            border-radius: 6px;
            font-family: monospace;
        }
        .challenge textarea {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 2px solid var(--border);
            background: var(--card);
            color: var(--text);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.95rem;
            resize: vertical;
            min-height: 80px;
            transition: border-color 0.2s;
        }
        .challenge textarea:focus {
            border-color: var(--solar);
            outline: none;
        }
        .challenge .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 12px;
        }
        .challenge .actions button {
            background: var(--toggle-bg);
            border: none;
            padding: 8px 20px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            color: var(--text);
            transition: 0.2s;
            font-size: 0.95rem;
        }
        .challenge .actions button:hover { background: var(--toggle-hover); }
        .challenge .actions button.primary {
            background: var(--solar);
            color: #1e293b;
        }
        .challenge .actions button.primary:hover { background: #fbbf24; }
        .challenge .result-box {
            margin-top: 14px;
            padding: 12px 16px;
            border-radius: 12px;
            background: var(--solution-bg);
            border-left: 4px solid var(--solar);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            white-space: pre-wrap;
            word-break: break-word;
            display: none;
        }
        .challenge .result-box.success {
            border-left-color: var(--success);
            background: var(--result-bg);
        }
        .challenge .result-box.error {
            border-left-color: var(--error);
            background: #fee2e2;
        }
        body.dark .challenge .result-box.error { background: #2a1a1a; }
        .challenge .result-box.visible { display: block; }
        .challenge .hint {
            font-size: 0.9rem;
            opacity: 0.7;
            margin-top: 10px;
            font-style: italic;
        }

        .reset-btn {
            background: var(--toggle-bg);
            border: none;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            color: var(--text);
            transition: 0.2s;
            font-size: 1rem;
            margin-top: 20px;
        }
        .reset-btn:hover { background: var(--toggle-hover); }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--card);
            color: var(--text);
            padding: 12px 28px;
            border-radius: 40px;
            box-shadow: var(--shadow);
            border-left: 4px solid var(--solar);
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.4s ease;

               <!-- <img src="https://png.pngtree.com/png-clipart/20230810/original/pngtree-illustrative-vector-of-a-large-argo-boat-on-a-white-background-vector-picture-image_10275593.png" alt="Корабль" style="height: 100%; width: auto;">⛵-->

        {

    <script type="module">
        import initSqlJs from 'sql.js';

        // ---- Тема ----
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const themeLabel = document.getElementById('themeLabel');

       

        // ---- Глобальные переменные ----
        let db = null;
        let wasAutoTheme = false;          // тема была переключена автоматически
        let userManuallyChangedTheme = false; // пользователь менял тему вручную
        let savedThemeBeforeAid = false;   // запоминаем, какая тема была до Аида
        let currentChallenge = 0;
        let challenges = [];
        const container = document.getElementById('challengesContainer');
        const progressFill = document.getElementById('progressFill');
        const ship = document.getElementById('ship');
        const toast = document.getElementById('toast');
        const dbInfoContent = document.getElementById('dbInfoContent');

        function setTheme(dark) {
            if (typeof wasAutoTheme !== 'undefined') {
                wasAutoTheme = false;
            }
            document.body.classList.toggle('dark', dark);
            themeIcon.textContent = dark ? '☀️' : '🌙';
            themeLabel.textContent = dark ? 'Светлая' : 'Тёмная';
            localStorage.setItem('theme', dark ? 'dark' : 'light');
        }
        function applyAutoThemeForAid(forceDark) {
            const currentTheme = document.body.classList.contains('dark');
            if (currentTheme === forceDark) return;
            if (userManuallyChangedTheme) return;
            wasAutoTheme = true;
            savedThemeBeforeAid = currentTheme;
            setTheme(forceDark);
            // Показываем уведомление
            if (forceDark) {
                showToast('🌑 Одиссей спускается в Аид... Тема переключена на тёмную для атмосферы.');
            } else {
                showToast('☀️ Одиссей покидает Аид. Тема возвращена.');
            }
        }
        const saved = localStorage.getItem('theme');
        setTheme(saved === 'dark');
        // Сброс флагов при загрузке
        userManuallyChangedTheme = false;
        wasAutoTheme = false;

        themeToggle.addEventListener('click', () => {
            userManuallyChangedTheme = true; // пользователь переключил вручную
            setTheme(!document.body.classList.contains('dark'));
        });


        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function showError(msg) {
            container.innerHTML = `
                <div style="background: var(--error); color: white; padding: 20px; border-radius: 16px; text-align: center; margin: 20px 0;">
                    <h2>⚠️ Ошибка</h2>
                    <p>${msg}</p>
                    <button onclick="location.reload()" style="margin-top:16px; background:white; border:none; padding:8px 24px; border-radius:30px; font-weight:600; cursor:pointer;">🔄 Обновить</button>
                </div>
            `;
        }

        // ---- Инициализация БД ----
        async function initDB() {
            try {
                const SQL = await initSqlJs({
                    locateFile: file => `https://esm.sh/sql.js@1.10.3/dist/${file}`
                });
                db = new SQL.Database();
                return true;
            } catch (e) {
                console.error('Ошибка инициализации SQL.js:', e);
                return false;
            }
        }

        // ---- Обновление информации о БД ----
        function updateDBInfo() {
    if (!db) {
        dbInfoContent.innerHTML = '<span class="empty">База данных не инициализирована</span>';
        return;
    }
    try {
        const tables = db.exec("SELECT name FROM sqlite_master WHERE type='table'");
        if (tables.length === 0 || tables[0].values.length === 0) {
            dbInfoContent.innerHTML = '<span class="empty">Таблиц пока нет</span>';
            return;
        }
        let html = '<div style="display:flex; flex-direction:column; gap:8px;">';
        tables[0].values.forEach(row => {
            const tableName = row[0];
            let count = 0;
            try {
                const res = db.exec(`SELECT COUNT(*) FROM ${tableName}`);
                if (res.length > 0) count = res[0].values[0][0];
            } catch(e) { count = '?'; }
            html += `
                <details style="border:1px solid var(--border); border-radius:8px; padding:8px 12px; transition: all 0.2s;" data-table="${tableName}">
                    <summary style="cursor:pointer; font-weight:600; display:flex; justify-content:space-between; align-items:center; user-select:none;">
                        <span>📊 ${tableName}</span>
                        <span style="font-weight:400; opacity:0.7;">${count} записей</span>
                    </summary>
                    <div style="margin-top:10px; max-height:400px; overflow:auto;" class="table-data"></div>
                </details>
            `;
        });
        html += '</div>';
        dbInfoContent.innerHTML = html;

        // Обработчики: загружаем данные только при первом открытии
        document.querySelectorAll('details[data-table]').forEach(details => {
            details.addEventListener('toggle', function() {
                if (this.open) {
                    const dataDiv = this.querySelector('.table-data');
                    if (dataDiv && !dataDiv.dataset.loaded) {
                        const tableName = this.dataset.table;
                        try {
                            const result = db.exec(`SELECT * FROM ${tableName} LIMIT 10`);
                            if (result.length > 0 && result[0].values.length > 0) {
                                dataDiv.innerHTML = formatTable(result);
                            } else {
                                dataDiv.innerHTML = '<span style="opacity:0.6;">(пусто)</span>';
                            }
                            dataDiv.dataset.loaded = true;
                        } catch(e) {
                            dataDiv.innerHTML = `<span style="color:var(--error);">Ошибка загрузки: ${e.message}</span>`;
                        }
                    }
                }
            });
        });
    } catch(e) {
        dbInfoContent.innerHTML = '<span class="empty">Ошибка получения информации</span>';
    }
}

        // ---- Форматирование таблицы ----
        function formatTable(result) {
            if (!result || result.length === 0 || !result[0].columns) {
                return '<span style="opacity:0.6;">(результатов нет)</span>';
            }
            let html = '<div style="margin: 8px 0; font-weight:600;">📋 Результат запроса:</div>';
            html += '<table style="width:100%; border-collapse: collapse; font-size:0.9rem;">';
            html += '<thead><tr>';
            result[0].columns.forEach(col => {
                html += `<th style="border:1px solid var(--border); padding: 4px 8px; text-align:left; background: var(--toggle-bg);">${col}</th>`;
            });
            html += '</tr></thead><tbody>';
            if (result[0].values.length === 0) {
                html += `<tr><td colspan="${result[0].columns.length}" style="text-align:center; opacity:0.6; padding:8px;">(пусто)</td></tr>`;
            } else {
                result[0].values.forEach(row => {
                    html += '<tr>';
                    row.forEach(cell => {
                        html += `<td style="border:1px solid var(--border); padding: 4px 8px;">${cell !== null ? cell : 'NULL'}</td>`;
                    });
                    html += '</tr>';
                });
            }
            html += '</tbody></table>';
            return html;
        }

        // ---- Определение испытаний (все 14 заданий) ----
function getChallenges() {
    return [
        // === 1. СОЗДАНИЕ ТАБЛИЦЫ КОМАНДЫ ===
        {

            story: 'Одиссей готовится к походу на Трою. Ему нужна таблица, чтобы записывать всех, кто отправится в плавание, и тех, кто останется дома.',
            task: 'Создайте таблицу "sailors" с колонками: id (INTEGER PRIMARY KEY), name (TEXT), role (TEXT), alive (BOOLEAN DEFAULT TRUE), lost_in (TEXT).',
            hint: 'CREATE TABLE sailors (id INTEGER PRIMARY KEY, name TEXT, role TEXT, alive BOOLEAN DEFAULT TRUE, lost_in TEXT);',
            validate: (db) => {
                try {
                    const tables = db.exec("SELECT name FROM sqlite_master WHERE type='table' AND name='sailors'");

                        return { success: false, message: '❌ Таблица "sailors" не найдена. Создай её с колонками: id, name, role, alive, lost_in.' };
                    }
                    const columns = db.exec("PRAGMA table_info(sailors)");

                    const expected = ['id', 'name', 'role', 'alive', 'lost_in'];
                    const hasExtra = colNames.some(col => !expected.includes(col));
                    const hasMissing = expected.some(col => !colNames.includes(col));
                    if (hasExtra || hasMissing) {
                        return { success: false, message: `❌ Таблица должна содержать колонки: id, name, role, alive, lost_in. Сейчас: ${colNames.join(', ')}` };

            task: 'Вставьте в таблицу "sailors" минимум 8 записей, включая Одиссея (капитан), минимум 9 моряков и хотя бы одного члена семьи.',

            validate: (db) => {

        },

        {

                    } else {
                        return { success: false, message: '❌ Колонка experience не найдена. Проверь запрос.' };

                } catch(e) {
                    return { success: false, message: '❌ Таблица sailors не существует или ошибка.' };

        },
        // === 4. ПРОСМОТР ВСЕХ ЗАПИСЕЙ ===
        {
            id: 4,
            title: '📊 Вся команда и семья',
            story: 'Одиссей хочет увидеть всех, кто в таблице – и моряков, и семью. Выведи все записи из таблицы sailors.',

                } catch(e) { return { success: false, message: '❌ Ошибка запроса. Проверь синтаксис.' }; }

                        return { success: true, message: '✅ Таблица "routes" создана!' };
                    } else {
                        return { success: false, message: `❌ Нужны колонки: id, name, danger_level, description. Сейчас: ${names.join(', ')}` };
                    }
                } catch(e) {
                    return { success: false, message: '❌ Ошибка: ' + e.message };
                }
            }
        },
        // === 31. ВСТАВКА МАРШРУТОВ ===
        {
            id: 31,
            title: '⚖️ Выбор пути (Сцилла или Харибда)',
            story: 'Вставьте два маршрута: "Сцилла" (опасность 9, "Шесть голов") и "Харибда" (опасность 10, "Водоворот").',
            task: 'Вставьте в таблицу "routes" записи о Сцилле и Харибде.',
            hint: 'INSERT INTO routes (id, name, danger_level, description) VALUES (1, "Сцилла", 9, "Шесть голов"), (2, "Харибда", 10, "Водоворот");',
            validate: (db) => {
                try {
                    const res = db.exec("SELECT COUNT(*) FROM routes");
                    const count = res[0].values[0][0];
                    if (count >= 2) {
                        const names = db.exec("SELECT name FROM routes");
                        const allNames = names[0].values.map(r => r[0]);
                        if (allNames.includes('Сцилла') && allNames.includes('Харибда')) {
                            return { success: true, message: '✅ Маршруты добавлены!' };
                        } else {
                            return { success: false, message: '❌ Не найдены оба маршрута. Проверь INSERT.' };
                        }
                    } else {
                        return { success: false, message: `❌ Мало записей (${count}). Нужно 2.` };
                    }
                } catch(e) {
                    return { success: false, message: '❌ Ошибка: ' + e.message };
                }
            }
        },
        // === 32. ОПАСНЫЙ МАРШРУТ (SELECT) ===
        {
            id: 32,
            title: '📉 Опасный маршрут',
            story: 'Найди маршрут с опасностью менее 10.',
            task: 'Напишите запрос, который выводит название маршрута (name) и опасность (danger_level) для маршрутов с опасностью меньше 10.',
            hint: 'SELECT name, danger_level FROM routes WHERE danger_level < 10;',
            validate: (db, result) => {
                if (result && result.length > 0 && result[0].values.length > 0) {
                    const rows = result[0].values.map(r => `${r[0]} (${r[1]})`).join(', ');
                    return { success: true, message: `✅ Найдены: ${rows}` };
                } else {
                    return { success: false, message: '❌ Нет маршрутов с опасностью < 10.' };
                }
            }
        },
        // === 33. ТРИНАРИЯ (UPDATE) ===
        {
            id: 33,
            title: '🐂 Священные быки Гелиоса',
            story: 'Команда съела быков, и Зевс наслал бурю. Все спутники (кроме Одиссея) погибли. Отметьте их как погибших в "тринария".',
            task: 'Обновите всех живых моряков (кроме Одиссея) – alive = FALSE, lost_in = "тринария".',
            hint: 'UPDATE sailors SET alive = FALSE, lost_in = "тринария" WHERE name != "Одиссей" AND role != "family";',
            validate: (db) => {
                try {
                    const res = db.exec("SELECT COUNT(*) FROM sailors WHERE alive = TRUE AND role != 'family'");
                    const count = res[0].values[0][0];
                    if (count === 1) {
                        return { success: true, message: '✅ Все спутники погибли у Тринарии. Остался только Одиссей.' };
                    } else {
                        return { success: false, message: `❌ Есть живые моряки (кроме Одиссея): ${count-1}. Проверь UPDATE.` };
                    }
                } catch(e) {
                    return { success: false, message: '❌ Ошибка запроса.' };
                }
            }
        },
        // === 34. КАЛИПСО: СОЗДАНИЕ ТАБЛИЦЫ ===
        {
            id: 34,
            title: '🏝️ Плен у Калипсо (создание таблицы)',
            story: 'Одиссей оказался на острове Огигия у нимфы Калипсо. Создайте таблицу "calypso" для записи годов заточения.',
            task: 'Создайте таблицу "calypso" с колонками: id INTEGER PRIMARY KEY, year INTEGER, event TEXT.',
            hint: 'CREATE TABLE calypso (id INTEGER PRIMARY KEY, year INTEGER, event TEXT);',
            validate: (db) => {
                try {
                    db.exec("SELECT * FROM calypso LIMIT 1");
                    return { success: true, message: '✅ Таблица "calypso" создана!' };
                } catch(e) {
                    return { success: false, message: '❌ Таблица не найдена. Попробуй ещё раз.' };
                }
            }
        },
        // === 35. ГОДЫ У КАЛИПСО (INSERT 7 записей) ===
        {
            id: 35,
            title: '📅 Годы у Калипсо',
            story: 'Запишите в таблицу "calypso" семь лет заточения: год 1 (плен), год 2 (плен), ... год 7 (освобождение).',
            task: 'Вставьте семь записей в таблицу "calypso".',
            hint: 'INSERT INTO calypso (id, year, event) VALUES (1, 1, "плен"), (2, 2, "плен"), (3, 3, "плен"), (4, 4, "плен"), (5, 5, "плен"), (6, 6, "плен"), (7, 7, "освобождение");',
            validate: (db) => {
                try {
                    const res = db.exec("SELECT COUNT(*) FROM calypso");
                    const count = res[0].values[0][0];
                    if (count >= 7) {
                        return { success: true, message: `✅ Добавлено ${count} лет. Одиссей свободен!` };
                    } else {
                        return { success: false, message: `❌ Мало записей (${count}). Нужно минимум 7.` };
                    }
                } catch(e) {
                    return { success: false, message: '❌ Таблица не существует.' };
                }
            }
        },
                // === 36. ФИНАЛ: ВОЗВРАЩЕНИЕ НА ИТАКУ ===
        {
            id: 36,
            title: '🏛️ Возвращение на Итаку',
            story: 'Одиссей наконец-то вернулся на Итаку. Сколько дней длилось его путешествие? Найдите общее количество дней в пути.',
            task: 'Напишите запрос, который выводит текущее значение days_remaining из таблицы journey (это общее количество дней, которое он плыл, включая все задержки).',
            hint: 'SELECT days_remaining FROM journey WHERE id = 1;',
            validate: (db, result) => {
                if (result && result.length > 0 && result[0].values.length > 0) {
                    const days = result[0].values[0][0];
                    // Проверяем, что значение разумное: минимум 30 (начальное) + 10 + 15 + 365 ≈ 420, но можно больше
                    if (days > 0) {
                        return { success: true, message: `✅ Одиссей вернулся домой! Его путешествие длилось ${days} дней (с учётом всех задержек и приключений).` };
                    } else {
                        return { success: false, message: '❌ Значение days_remaining не соответствует ожидаемому. Проверь, что ты обновил все задержки.' };
                    }
                } else {
                    return { success: false, message: '❌ Запись в journey не найдена. Выполни задание 10.' };
                }
            }
        },
        // === 37. ИТОГОВАЯ СТАТИСТИКА ПУТЕШЕСТВИЯ ===
        {
            id: 37,
            title: '📊 Итоговая статистика путешествия',
            story: 'Подведите итоги: сколько моряков выжило, сколько погибло, и в каких местах они погибли.',
            task: 'Напишите запрос, который выводит количество живых (alive = TRUE) и погибших (alive = FALSE) моряков, а также общее количество погибших по местам (lost_in).',
            hint: 'SELECT alive, COUNT(*) as count FROM sailors GROUP BY alive;\n-- и отдельно:\nSELECT lost_in, COUNT(*) as lost_count FROM sailors WHERE alive = FALSE GROUP BY lost_in;',
            validate: (db, result) => {
                // Проверяем, есть ли данные
                try {
                    const aliveCheck = db.exec("SELECT COUNT(*) FROM sailors WHERE alive = TRUE");
                    const deadCheck = db.exec("SELECT COUNT(*) FROM sailors WHERE alive = FALSE");
                    if (aliveCheck.length > 0 && deadCheck.length > 0) {
                        const aliveCount = aliveCheck[0].values[0][0];
                        const deadCount = deadCheck[0].values[0][0];
                        let msg = `✅ Итоги:\nЖивых: ${aliveCount}\nПогибших: ${deadCount}\n`;
                        // Дополнительно вывод по местам потерь
                        const losses = db.exec("SELECT lost_in, COUNT(*) FROM sailors WHERE alive = FALSE GROUP BY lost_in");
                        if (losses.length > 0 && losses[0].values.length > 0) {
                            msg += 'Потери по местам:\n';
                            losses[0].values.forEach(row => {
                                msg += `  ${row[0]}: ${row[1]}\n`;
                            });
                        } else {
                            msg += 'Нет данных о местах потерь.';
                        }
                        return { success: true, message: msg };
                    } else {
                        return { success: false, message: '❌ Не удалось получить статистику. Проверь таблицу sailors.' };
                    }
                } catch(e) {
                    return { success: false, message: '❌ Ошибка запроса: ' + e.message };
                }
            }
        }
    ];
}

 
        // ---- Отрисовка испытаний (только текущее) ----
        function renderChallenges() {
            container.innerHTML = '';
            // Если все задания пройдены
            if (currentChallenge >= challenges.length) {
                container.innerHTML = `
                    <div style="background: var(--success); color: white; padding: 20px; border-radius: 16px; text-align: center; margin: 20px 0;">
                        <h2 style="margin-bottom: 10px;">🏆 Поздравляем!</h2>
                        <p>Ты прошёл все испытания SQL-одиссеи! 🚢</p>
                        <button onclick="window.resetGame()" style="margin-top:16px; background:white; border:none; padding:8px 24px; border-radius:30px; font-weight:600; cursor:pointer; color: #1e293b;">🔄 Пройти заново</button>
                    </div>
                `;
                return;
            }

            const ch = challenges[currentChallenge];
            const div = document.createElement('div');
            div.className = 'challenge';
            div.innerHTML = `
                <div class="title">${ch.title}</div>
                <div class="story">${ch.story}</div>
                <div class="task">${ch.task}</div>
                <textarea id="query-${currentChallenge}" ...>${ch.savedQuery || ''}</textarea>
                <div class="actions">
                    <button class="primary" id="run-${currentChallenge}">🚀 Выполнить</button>
                    <button id="hint-${currentChallenge}">💡 Подсказка</button>
                </div>
                <div class="result-box" id="result-${currentChallenge}"></div>
                <button id="next-${currentChallenge}" style="display:none; background: var(--success); color: white; border: none; padding: 8px 20px; border-radius: 30px; font-weight: 600; cursor: pointer; margin-top: 12px;">➡️ Следующее задание</button>
                <div class="hint" id="hintText-${currentChallenge}" style="display:none;">${ch.hint}</div>
            `;

            // Определяем, нужно ли переключить тему для Аида
    const currentId = challenges[currentChallenge] ? challenges[currentChallenge].id : 0;
    if (currentId >= 21 && currentId <= 23) {
        // Если тема светлая и пользователь не вмешивался, делаем тёмную
        if (!document.body.classList.contains('dark') && !userManuallyChangedTheme) {
            applyAutoThemeForAid(true);
            wasAutoTheme = true;
        }
    } else {
        // Если вышли из блока Аида и тема была автоматически изменена, возвращаем светлую
        if (wasAutoTheme && document.body.classList.contains('dark')) {
            // Но только если пользователь не переключал вручную после авто-переключения
            if (!userManuallyChangedTheme) {
                console.log('Возвращаем светлую тему');
                applyAutoThemeForAid(false);

            }
            wasAutoTheme = false;
        }
    }

            container.appendChild(div);

            // Обработчики для текущего задания
            const queryInput = document.getElementById(`query-${currentChallenge}`);
            const runBtn = document.getElementById(`run-${currentChallenge}`);
            const hintBtn = document.getElementById(`hint-${currentChallenge}`);
            const resultBox = document.getElementById(`result-${currentChallenge}`);
            const hintText = document.getElementById(`hintText-${currentChallenge}`);

            if (ch.savedQuery) queryInput.value = ch.savedQuery;

            runBtn.addEventListener('click', async () => {
                const query = queryInput.value.trim();
                if (!query) {
                    resultBox.textContent = '❌ Введите запрос.';
                    resultBox.className = 'result-box visible error';
                    resultBox.style.display = 'block';
                    return;
                }
                ch.savedQuery = query;
                try {
                    const result = db.exec(query);
                    const isSelect = query.toUpperCase().trim().startsWith('SELECT');
                    const validation = ch.validate(db, result);
                    let msg = validation.message;
                    if (isSelect) {
                        const tableHtml = formatTable(result);
                        msg += '<br><hr style="margin: 8px 0;">' + tableHtml;
                    }
                    resultBox.innerHTML = msg;
                    resultBox.style.display = 'block';
                    if (validation.success) {
                        resultBox.innerHTML = msg;
                        resultBox.className = 'result-box visible success';
                        // Показываем кнопку "Следующее задание"
                        const nextBtn = document.getElementById(`next-${currentChallenge}`);
                        if (nextBtn) nextBtn.style.display = 'inline-block';
                        // Блокируем кнопку "Выполнить" и текстовое поле
                        runBtn.disabled = true;
                        queryInput.disabled = true;
                        showToast('🎉 Испытание пройдено! Нажмите "Следующее задание" чтобы продолжить.');
                    } else {
                        resultBox.innerHTML = msg;
                        resultBox.className = 'result-box visible error';
                    }
                    const nextBtn = document.getElementById(`next-${currentChallenge}`);
                    if (nextBtn) {
                        nextBtn.addEventListener('click', () => {
                            currentChallenge++;
                            updateProgress();
                            renderChallenges();
                            updateDBInfo();
                        });
                    }
                } catch (e) {
                    resultBox.textContent = `❌ Ошибка: ${e.message}`;
                    resultBox.className = 'result-box visible error';
                    resultBox.style.display = 'block';
                }
                updateDBInfo();
            });

            hintBtn.addEventListener('click', () => {
                if (hintText.style.display === 'none') {
                    hintText.style.display = 'block';
                    hintBtn.textContent = '🙈 Скрыть подсказку';
                } else {
                    hintText.style.display = 'none';
                    hintBtn.textContent = '💡 Подсказка';
                }
            });
        }

        function updateProgress() {
            const total = challenges.length;
            const completed = currentChallenge;
            const percent = Math.min((completed / total) * 100, 100);
            progressFill.style.width = percent + '%';
            if (ship) ship.style.left = percent + '%';
        }

        async function resetGame() {
            const ok = await initDB();
            if (!ok) {
                showError('Не удалось перезапустить игру: ошибка инициализации БД.');
                return;
            }
            currentChallenge = 0;
            challenges.forEach(ch => ch.savedQuery = '');
            renderChallenges();
            updateProgress();
            updateDBInfo();
            showToast('🔄 Игра перезапущена!');
        }

        // ---- Запуск игры ----
        async function startGame() {
            const ok = await initDB();
            if (!ok) {
                showError('Не удалось инициализировать базу данных.');
                return;
            }
            challenges = getChallenges();
            currentChallenge = 0;
            renderChallenges();
            updateProgress();
            updateDBInfo();
            document.getElementById('resetBtn').addEventListener('click', resetGame);
            // Делаем resetGame глобальной для кнопки в поздравлении
            window.resetGame = resetGame;
        }

        startGame();
    </script>
