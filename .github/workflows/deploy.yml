name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: interactive-sql-card-game/package-lock.json

      - name: Install dependencies
        working-directory: interactive-sql-card-game
        run: npm ci

      - name: Build SQL trainer
        working-directory: interactive-sql-card-game
        env:
          BASE_PATH: /interactive-sql-card-game
          NEXT_PUBLIC_ONLINE: "0"
        run: node scripts/build-static.mjs

      - name: Assemble site
        run: |
          mkdir -p site
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env*' \
            --exclude='interactive-sql-card-game/' \
            --exclude='out/' \
            --exclude='site/' \
            --exclude='node_modules/' \
            --exclude='.next/' \
            --exclude='package-lock.json' \
            --exclude='README.md' \
            --exclude='_config.yml' \
            ./ site/
          mkdir -p site/interactive-sql-card-game
          cp -a interactive-sql-card-game/out/. site/interactive-sql-card-game/
          touch site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
