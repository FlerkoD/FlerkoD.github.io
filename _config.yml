# =====================================================
# ОСНОВНЫЕ НАСТРОЙКИ САЙТА
# =====================================================
title: "SQL-практикум"
description: "Интерактивный сборник задач по SQL для обучения (тестовая версия)"
url: "https://flerkod.github.io"
baseurl: ""
lang: "ru-RU"

# =====================================================
# ТЕМА И ПЛАГИНЫ
# =====================================================
remote_theme: "mmistakes/minimal-mistakes@4.26.2"
plugins:
 # - jekyll-feed
 # - jekyll-seo-tag
 # - jekyll-sitemap
  - jekyll-remote-theme

minimal_mistakes_skin: "contrast"

# =====================================================
# ТЕСТОВЫЙ РЕЖИМ – ЗАПРЕТ ИНДЕКСАЦИИ
# =====================================================
# Включаем, чтобы поисковики не индексировали тестовый сайт
test_mode: true

# =====================================================
# АВТОР И СОЦСЕТИ
# =====================================================
author:
  name: ""
  bio: ""
  location: "Беларусь"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/flerkod"

# =====================================================
# НАВИГАЦИЯ (МЕНЮ)
# =====================================================
main:
  - title: "Главная"
    url: "/"
  - title: "Летний адвент"
    url: "/advent_sql.html"
  - title: "Библиотека задач"
    url: "/sql_tasks.html"

# =====================================================
# ДОПОЛНИТЕЛЬНЫЕ НАСТРОЙКИ
# =====================================================
exclude:
  - .jekyll-cache
  - .idea/
  - .gitignore
  - README.md
  - LICENSE

include:
  - .htaccess

